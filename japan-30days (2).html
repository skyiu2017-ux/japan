<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일본여행 대비 30일 일본어 특훈</title>
<style>
  /* =========================================================
     디자인 토큰
     - 배경: 화지(和紙) 느낌의 따뜻한 오프화이트 #F7F4EE
     - 주조색: 쪽빛 인디고 #1F3A5F (차분/신뢰)
     - 강조색: 주황빛 감빛(柿色) #E8702A (여행/설렘, 체크/포인트)
     - 보조: 먹빛 #2B2B2B, 흐린 글자 #8A8378
     - 일본어는 명조 계열로 크게, 한국어 뜻은 고딕으로 작게
     ========================================================= */
  :root{
    --bg:#F7F4EE;
    --card:#FFFFFF;
    --ink:#2B2B2B;
    --indigo:#1F3A5F;
    --indigo-soft:#E7ECF2;
    --kaki:#E8702A;
    --kaki-soft:#FBEADF;
    --muted:#8A8378;
    --line:#E8E2D6;
    --good:#3F8F5B;
    --shadow:0 1px 3px rgba(31,58,95,.06),0 8px 24px rgba(31,58,95,.08);
    --radius:18px;
    --jp-font:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --kr-font:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--kr-font);
    line-height:1.6;
    padding-bottom:90px;
  }

  /* ---------- 상단 헤더 ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(247,244,238,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-wrap{max-width:560px;margin:0 auto;padding:14px 18px 10px}
  .head-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .brand{font-size:15px;font-weight:800;color:var(--indigo);letter-spacing:-.2px}
  .brand .jp{font-family:var(--jp-font);font-weight:600}
  .countdown{font-size:12px;color:var(--muted)}
  .countdown b{color:var(--kaki);font-size:13px}

  /* 진행 바 */
  .progress-row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .bar{flex:1;height:7px;background:var(--indigo-soft);border-radius:99px;overflow:hidden}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--kaki));border-radius:99px;width:0;transition:width .4s ease}
  .progress-label{font-size:11px;color:var(--muted);white-space:nowrap}

  /* 모드 전환 토글 */
  .mode-switch{display:flex;gap:6px;margin-top:11px;background:var(--indigo-soft);padding:4px;border-radius:12px}
  .mode-btn{flex:1;padding:9px 6px;border:none;border-radius:9px;background:transparent;font-family:var(--kr-font);font-size:13px;font-weight:800;color:var(--indigo);cursor:pointer;transition:.15s}
  .mode-btn.active{background:#fff;box-shadow:0 1px 4px rgba(31,58,95,.12)}
  #modeScene.active{color:var(--kaki)}
  body.scene-mode .study-only{display:none !important}

  /* Day 네비게이션 (가로 스크롤 칩) */
  .day-nav{max-width:560px;margin:0 auto;padding:8px 12px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .day-nav::-webkit-scrollbar{display:none}
  .day-chip{
    flex:0 0 auto;min-width:46px;padding:7px 4px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);text-align:center;cursor:pointer;font-size:12px;color:var(--muted);
    font-weight:600;transition:.18s;position:relative;
  }
  .day-chip .d{display:block;font-size:9px;letter-spacing:.5px;text-transform:uppercase;opacity:.7}
  .day-chip .n{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.2}
  .day-chip.active{background:var(--indigo);border-color:var(--indigo)}
  .day-chip.active .n,.day-chip.active{color:#fff}
  .day-chip.active .d{color:#fff}
  .day-chip.done::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:99px;background:var(--good)}
  .day-chip.locked{opacity:.45}

  /* ---------- 본문 ---------- */
  main{max-width:560px;margin:0 auto;padding:16px 14px 24px}

  .day-title{display:flex;align-items:center;gap:10px;margin:6px 4px 14px}
  .day-title .big{font-size:13px;font-weight:800;color:#fff;background:var(--kaki);padding:4px 12px;border-radius:99px;letter-spacing:.3px}
  .day-title .sub{font-size:13px;color:var(--muted)}
  .day-title .sub b{color:var(--indigo)}

  /* 섹션 카드 */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 18px;margin-bottom:13px;box-shadow:var(--shadow);
  }
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:13px}
  .sec-num{
    width:24px;height:24px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);
    font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;font-family:var(--jp-font)
  }
  .sec-title{font-size:14px;font-weight:800;color:var(--indigo);letter-spacing:-.2px}
  .sec-title .em{color:var(--kaki)}

  /* 글자(가나) 칸 */
  .kana-row{margin-bottom:12px}
  .kana-row:last-child{margin-bottom:0}
  .kana-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .kana-grid{display:flex;gap:7px;flex-wrap:wrap}
  .kana{
    flex:1 1 0;min-width:52px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:9px 4px 7px;text-align:center;
  }
  .kana .ch{font-family:var(--jp-font);font-size:30px;line-height:1;color:var(--ink)}
  .kana .ro{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}
  .kana.kata .ch{color:var(--indigo)}

  /* 동사 카드 */
  .verb{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--kaki-soft),#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .verb .jp{font-family:var(--jp-font);font-size:34px;color:var(--kaki);line-height:1.1}
  .verb .meta .ro{font-size:13px;color:var(--muted);font-weight:600}
  .verb .meta .mn{font-size:16px;font-weight:800;color:var(--ink)}

  /* 3단 리스트 (일본어 / 읽기 / 뜻) */
  .triple{display:flex;flex-direction:column;gap:9px}
  .item{padding:11px 13px;background:var(--bg);border-radius:13px;border:1px solid var(--line)}
  .item .jp{font-family:var(--jp-font);font-size:21px;color:var(--ink);line-height:1.35;letter-spacing:.3px}
  .item .ro{font-size:12.5px;color:var(--indigo);font-weight:600;margin-top:3px}
  .item .mn{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* 단어는 조금 더 컴팩트하게 */
  .word .jp{font-size:20px}

  /* 20회 따라 읽기 */
  .read-target{background:var(--indigo);color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:14px}
  .read-target .lbl{font-size:11px;opacity:.75;font-weight:700;margin-bottom:6px;letter-spacing:.3px}
  .read-target .jp{font-family:var(--jp-font);font-size:22px;line-height:1.5}
  .read-target .jp + .jp{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.18)}

  .read-count{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .read-count .now{font-family:var(--jp-font);font-size:30px;font-weight:700;color:var(--kaki)}
  .read-count .now small{font-size:15px;color:var(--muted);font-weight:600;font-family:var(--kr-font)}
  .read-count .msg{font-size:12px;color:var(--good);font-weight:700;opacity:0;transition:.3s}
  .read-count .msg.show{opacity:1}

  .dots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
  .dot{
    aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
    cursor:pointer;transition:.13s;display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:700;
  }
  .dot.on{background:var(--kaki);border-color:var(--kaki);color:#fff;transform:scale(1.04)}
  .read-actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);font-family:var(--kr-font)}
  .btn.primary{background:var(--kaki);border-color:var(--kaki);color:#fff}
  .btn:active{transform:scale(.98)}

  /* 미니 읽기 트레이너 (단어 5회 / 회화 3회) */
  .mini{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .mini-head .t{font-size:13px;font-weight:800;color:var(--indigo)}
  .mini-head .t .em{color:var(--kaki)}
  .mini-head .c{font-size:13px;font-weight:800;color:var(--kaki);font-family:var(--jp-font)}
  .mini-head .c small{font-size:11px;color:var(--muted);font-family:var(--kr-font);font-weight:600}
  .mini-head .c.full{color:var(--good)}
  .mini-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .mini-line{font-family:var(--jp-font);font-size:16px;color:var(--ink);padding:2px 0}
  .mini-line .mn{font-family:var(--kr-font);font-size:11px;color:var(--muted);margin-left:8px}
  .mini-dots{display:flex;gap:7px}
  .mini-dots .dot{flex:1;max-width:46px}

  /* 회화 */
  .talk{display:flex;flex-direction:column;gap:8px}
  .line{display:flex;gap:9px;align-items:flex-start}
  .who{flex:0 0 auto;width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;margin-top:3px}
  .who.a{background:var(--indigo)}
  .who.b{background:var(--kaki)}
  .bubble{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .bubble .jp{font-family:var(--jp-font);font-size:19px;color:var(--ink);line-height:1.4}
  .bubble .mn{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* 한자 */
  .kanji-grid{display:flex;gap:10px}
  .kanji{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
  .kanji .ch{font-family:var(--jp-font);font-size:46px;line-height:1;color:var(--indigo)}
  .kanji .yomi{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
  .kanji .mn{font-size:13px;font-weight:800;color:var(--ink);margin-top:2px}

  /* 문화 한 줄 */
  .culture{background:var(--kaki-soft);border:1px solid #F2D8C5;border-radius:14px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start}
  .culture .icon{font-size:20px;flex:0 0 auto}
  .culture p{margin:0;font-size:13.5px;color:#7A3A14;line-height:1.55;font-weight:500}

  /* 1분 스피킹 */
  .speak{display:flex;flex-direction:column;gap:8px}
  .speak .row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
  .speak .kr{flex:1;font-size:13px;color:var(--muted);font-weight:600}
  .speak .arrow{color:var(--kaki);font-weight:800;flex:0 0 auto}
  .speak .jp{flex:1.3;font-family:var(--jp-font);font-size:18px;color:var(--ink);text-align:right}

  /* 누적 복습 (별도 박스) */
  .review{background:linear-gradient(160deg,#FBFAF6,#F1ECE1);border:1.5px dashed var(--indigo);border-radius:var(--radius);padding:16px}
  .review .sec-title{color:var(--indigo)}

  /* 최종 테스트 카드 (Day 30) */
  .test-card{background:linear-gradient(160deg,#1F3A5F,#16293f);color:#fff;border-radius:16px;padding:16px;margin-bottom:11px}
  .test-card .tnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--kaki);color:#fff;font-weight:800;font-size:13px;font-family:var(--jp-font);margin-bottom:9px}
  .test-card .tt{font-size:15px;font-weight:800;margin-bottom:6px}
  .test-card .td{font-size:13px;opacity:.82;line-height:1.55}
  .test-card .tcheck{display:flex;align-items:center;gap:9px;margin-top:12px;cursor:pointer;font-size:13px;font-weight:700}
  .test-card .box{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
  .test-card .box.on{background:var(--kaki);border-color:var(--kaki)}
  .test-card .box.on::after{content:"✓";font-size:14px;font-weight:800}

  /* 핵심 한자 50자 표 */
  .kanji50{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;margin-top:10px}
  .k50{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
  .k50 .ch{font-family:var(--jp-font);font-size:26px;line-height:1;color:var(--indigo)}
  .k50 .mn{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600}
  .k50 .yo{font-size:9px;color:var(--kaki);margin-top:1px;font-weight:600}

  /* ===== 실전 시나리오 ===== */
  .scene-intro{max-width:560px;margin:0 auto;padding:16px 18px 4px}
  .scene-intro h2{font-size:18px;font-weight:900;color:var(--indigo);margin:0 0 4px}
  .scene-intro p{font-size:13px;color:var(--muted);margin:0;line-height:1.55}
  .scene-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
  .scene-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .scene-ic{font-size:30px;flex:0 0 auto;line-height:1}
  .scene-meta{flex:1}
  .scene-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--kaki);background:var(--kaki-soft);padding:3px 9px;border-radius:99px;margin-bottom:5px}
  .scene-title{font-size:17px;font-weight:900;color:var(--ink);line-height:1.2}
  .scene-desc{font-size:12.5px;color:var(--muted);margin:8px 0 14px;line-height:1.55}
  .scene-words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
  .scene-word{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
  .scene-word .jp{font-family:var(--jp-font);font-size:16px;color:var(--indigo)}
  .scene-word .mn{font-size:11px;color:var(--muted);margin-left:5px}
  .scene-lines{display:flex;flex-direction:column;gap:8px}
  .scene-line{padding:11px 13px;background:linear-gradient(135deg,var(--indigo-soft),#fff);border-radius:12px;border:1px solid var(--line)}
  .scene-line .jp{font-family:var(--jp-font);font-size:21px;color:var(--ink);line-height:1.35}
  .scene-line .ro{font-size:12px;color:var(--indigo);font-weight:600;margin-top:3px}
  .scene-line .mn{font-size:12.5px;color:var(--muted);margin-top:1px}
  .scene-tip{margin-top:13px;background:var(--kaki-soft);border:1px solid #F2D8C5;border-radius:12px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start}
  .scene-tip .i{flex:0 0 auto}
  .scene-tip p{margin:0;font-size:12.5px;color:#7A3A14;line-height:1.5;font-weight:500}

  /* 최종 미션 시뮬레이션 */
  .mission{background:linear-gradient(160deg,#1F3A5F,#13243a);border-radius:var(--radius);padding:18px 16px;margin-bottom:13px}
  .mission h3{color:#fff;font-size:17px;font-weight:900;margin:0 0 3px}
  .mission .sub{color:rgba(255,255,255,.7);font-size:12.5px;margin-bottom:16px}
  .mstep{display:flex;align-items:center;gap:12px;position:relative}
  .mstep .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .mstep .body{flex:1;padding:10px 0}
  .mstep .place{font-size:11px;color:var(--kaki);font-weight:800;letter-spacing:.3px}
  .mstep .jp{font-family:var(--jp-font);font-size:19px;color:#fff;line-height:1.3;margin-top:2px}
  .mstep .mn{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:1px}
  .mline{height:14px;width:2px;background:rgba(255,255,255,.2);margin-left:21px}
  .review-list{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .review-item{display:flex;gap:10px;align-items:baseline;padding:9px 12px;background:rgba(255,255,255,.7);border-radius:11px}
  .review-item .jp{font-family:var(--jp-font);font-size:18px;color:var(--ink);flex:1}
  .review-item .mn{font-size:11.5px;color:var(--muted);flex:0 0 auto;max-width:42%;text-align:right}
  .review-empty{font-size:13px;color:var(--muted);text-align:center;padding:8px}

  /* 완료 버튼 */
  .finish{margin-top:6px;width:100%;padding:15px;border:none;border-radius:14px;background:var(--indigo);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--kr-font);box-shadow:var(--shadow)}
  .finish.done{background:var(--good)}
  .finish:active{transform:scale(.99)}

  /* 하단 고정 이동 바 */
  .footer-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(247,244,238,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .footer-wrap{max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  .footer-wrap button{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:13px;color:var(--ink);font-family:var(--kr-font)}
  .footer-wrap .center{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .footer-wrap .center b{color:var(--indigo);font-size:14px}

  .note{font-size:11px;color:var(--muted);text-align:center;margin:14px 4px 0;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="head-wrap">
    <div class="head-top">
      <div class="brand"><span class="jp">日本語</span> 히로시마 여행 특훈</div>
      <div class="countdown" id="headRight">목표 <b id="goalDays">30</b>일 · 하루 15~20분</div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="modeStudy">📖 30일 학습</button>
      <button class="mode-btn" id="modeScene">🎯 실전 시나리오</button>
    </div>
    <div class="progress-row study-only">
      <div class="bar"><span id="progBar"></span></div>
      <div class="progress-label"><b id="doneCount">0</b>/30 완료</div>
    </div>
  </div>
  <nav class="day-nav study-only" id="dayNav"></nav>
</header>

<main id="dayContent"></main>
<main id="sceneContent" style="display:none"></main>

<div class="footer-nav study-only" id="footerNav">
  <div class="footer-wrap">
    <button id="prevBtn">← 이전</button>
    <div class="center">Day <b id="curDay">1</b> / 30</div>
    <button id="nextBtn">다음 →</button>
  </div>
</div>

<script>
/* =========================================================
   콘텐츠 데이터
   - 여기 DAYS 배열만 채우면 30일이 자동으로 렌더링됨
   - 디자인/로직은 건드릴 필요 없음
   ========================================================= */

// 매일 맨 아래 고정 반복 20문장 (선생님 자료)
const FIXED20 = [
  ["私は韓国人です。","わたしは かんこくじんです","저는 한국인입니다."],

/* ---------------------------------------------------------
   상태 저장
   ⚠️ Claude 미리보기 안에서는 localStorage가 막혀 있어 새로고침 시
      체크가 사라질 수 있습니다. GitHub Pages 등 실제 배포에서는
      정상 저장됩니다. (아래 store가 자동 폴백 처리)
   --------------------------------------------------------- */
const store = (()=>{
  let mem = {};
  let ok = false;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok=true; }catch(e){ ok=false; }
  return {
    get(k,def){ try{ if(ok){const v=localStorage.getItem(k);return v===null?def:JSON.parse(v);} }catch(e){} return (k in mem)?mem[k]:def; },
    set(k,v){ try{ if(ok){localStorage.setItem(k,JSON.stringify(v));return;} }catch(e){} mem[k]=v; }
  };
})();

let current = store.get("jp_current", 1);
if(current < 1 || current > TOTAL_DAYS) current = 1;

/* ---------- 렌더 헬퍼 ---------- */
function dayDone(d){ return store.get("jp_done_"+d, false); }
function readCount(d){ return store.get("jp_read_"+d, 0); }

function renderNav(){
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  for(let d=1; d<=TOTAL_DAYS; d++){
    const chip = document.createElement("div");
    chip.className = "day-chip" + (d===current?" active":"") + (dayDone(d)?" done":"") + (DAYS[d-1]?"":" locked");
    chip.innerHTML = `<span class="d">Day</span><span class="n">${d}</span>`;
    chip.onclick = ()=>{ current=d; store.set("jp_current",d); render(); };
    nav.appendChild(chip);
  }
  // 현재 칩이 보이게 스크롤
  const active = nav.querySelector(".active");
  if(active) active.scrollIntoView({inline:"center",block:"nearest"});
}

function renderProgress(){
  let done=0;
  for(let d=1; d<=TOTAL_DAYS; d++) if(dayDone(d)) done++;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("progBar").style.width = (done/TOTAL_DAYS*100)+"%";
  document.getElementById("curDay").textContent = current;
}

function tripleItems(arr, extraClass){
  return arr.map(([jp,ro,mn])=>`
    <div class="item ${extraClass||""}">
      <div class="jp">${jp}</div>
      <div class="ro">${ro}</div>
      <div class="mn">${mn}</div>
    </div>`).join("");
}

/* 누적 복습: 직전 2일치 핵심 문장에서 뽑아오기 */
function buildReview(d){
  const pool=[];
  for(let i=Math.max(1,d-2); i<d; i++){
    const day=DAYS[i-1];
    if(!day) continue;
    // 각 날의 첫 두 문장만
    day.sentences.slice(0,2).forEach(s=>pool.push(s));
  }
  return pool;
}

  });

  document.getElementById("finishBtn").onclick = ()=>{
    const nv = !dayDone(current);
    store.set("jp_done_"+current, nv);
    render();
  };
}

/* 20회 점 렌더 + 이벤트 */
function bindReadEvents(){
  const dotsWrap = document.getElementById("readDots");
  if(!dotsWrap) return;
  let count = readCount(current);

  function paint(){
    dotsWrap.innerHTML="";
    for(let i=1;i<=READ_GOAL;i++){
      const dot=document.createElement("div");
      dot.className="dot"+(i<=count?" on":"");
      dot.textContent=i;
      dot.onclick=()=>{ count = (i===count)?i-1:i; save(); };
      dotsWrap.appendChild(dot);
    }
    document.getElementById("readNow").textContent=count;
    const msg=document.getElementById("readMsg");
    msg.classList.toggle("show", count>=READ_GOAL);
  }
  function save(){ count=Math.max(0,Math.min(READ_GOAL,count)); store.set("jp_read_"+current,count); paint(); }

  document.getElementById("readPlus").onclick=()=>{ if(count<READ_GOAL){count++;save();} };
  document.getElementById("readReset").onclick=()=>{ count=0; save(); };
  paint();

  // --- 미니 카운터 (단어 5회 / 회화 3회) ---
  bindMiniCounter("word", 5, "wordDots", "wordNow", "wordCntLbl");
  bindMiniCounter("talk", 3, "talkDots", "talkNow", "talkCntLbl");
}

/* 재사용 미니 읽기 카운터 */
function bindMiniCounter(key, goal, dotsId, nowId, lblId){
  const wrap=document.getElementById(dotsId);
  if(!wrap) return;
  const storeKey="jp_"+key+"_"+current;
  let c=store.get(storeKey,0);
  function paint(){
    wrap.innerHTML="";
    for(let i=1;i<=goal;i++){
      const d=document.createElement("div");
      d.className="dot"+(i<=c?" on":"");
      d.textContent=i;
      d.onclick=()=>{ c=(i===c)?i-1:i; save(); };
      wrap.appendChild(d);
    }
    document.getElementById(nowId).textContent=c;
    document.getElementById(lblId).classList.toggle("full", c>=goal);
  }
  function save(){ c=Math.max(0,Math.min(goal,c)); store.set(storeKey,c); paint(); }
  paint();
}

document.getElementById("nextBtn").onclick=()=>{ if(current<TOTAL_DAYS){current++;store.set("jp_current",current);render();} };

function setMode(mode){
  const study = mode==="study";
  document.body.classList.toggle("scene-mode", !study);
  document.getElementById("dayContent").style.display = study?"":"none";
  document.getElementById("sceneContent").style.display = study?"none":"";
  document.getElementById("modeStudy").classList.toggle("active", study);
  document.getElementById("modeScene").classList.toggle("active", !study);
  document.getElementById("headRight").innerHTML = study
    ? '목표 <b id="goalDays">30</b>일 · 하루 15~20분'
    : '상황별 · 출발 직전 벼락치기';
  store.set("jp_mode", mode);
  if(!study) renderScenes();
  window.scrollTo(0,0);
}
document.getElementById("modeStudy").onclick=()=>setMode("study");
document.getElementById("modeScene").onclick=()=>setMode("scene");
