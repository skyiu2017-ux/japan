<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히로시마 D-14 실전 특훈 v3</title>
<style>
:root{
--bg:#F3F5F4;--card:#FFFFFF;--ink:#1C2B33;--muted:#6C7A80;
--sea:#16324A;--seaDeep:#0D2233;--torii:#D8432B;--toriiSoft:#FBE9E4;
--moss:#3E7C59;--mossSoft:#E7F1EA;--soft:#E4EAEC;--line:#DDE4E4;
--shadow:0 1px 3px rgba(22,50,74,.06),0 10px 26px rgba(22,50,74,.09);
--jp:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
--kr:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);line-height:1.65;padding-bottom:96px}
header{position:sticky;top:0;z-index:50;background:rgba(243,245,244,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:13px 14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-weight:900;color:var(--sea);font-size:18px;letter-spacing:-.3px}
.sub{font-size:11.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:900;color:var(--torii);white-space:nowrap;text-align:right}
.badge small{display:block;color:var(--muted);font-weight:700;font-size:10.5px}
.bar{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--torii));transition:.3s}
.tabs{display:flex;gap:7px;margin-top:11px}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:12px;background:var(--soft);color:var(--sea);font-family:var(--kr);font-weight:900;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--torii);color:#fff}
.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;color:var(--muted);font-weight:900;cursor:pointer;min-width:58px;text-align:center;line-height:1.25}
.chip small{display:block;font-size:10px;font-weight:700}
.chip.done{border-color:var(--moss);color:var(--moss);background:var(--mossSoft)}
.chip.active{background:var(--sea);border-color:var(--sea);color:#fff}
.chip.active small{color:rgba(255,255,255,.75)}
main{max-width:760px;margin:0 auto;padding:16px 14px 28px}
.hero{background:linear-gradient(140deg,var(--sea),var(--seaDeep));color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .dday{display:inline-block;background:var(--torii);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:8px}
.hero h1{margin:0;font-size:23px;line-height:1.3}
.hero p{margin:7px 0 0;color:rgba(255,255,255,.78);font-size:13px;word-break:keep-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);overflow:visible;height:auto}
.sec{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:900;color:var(--sea)}
.sec .num{width:25px;height:25px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--torii);font-size:12px;flex:0 0 auto}
.sec .act{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--sea);border-radius:999px;padding:5px 11px;font-family:var(--kr);font-weight:900;font-size:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.phrase{background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:12px;overflow:visible;height:auto;position:relative}
.jp{font-family:var(--jp);font-size:22px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
rt{font-size:10px;color:var(--torii);font-family:var(--kr);font-weight:800;letter-spacing:0}
.ko{font-size:13px;color:var(--muted);margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.sound{font-size:12.5px;color:var(--sea);font-weight:900;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stars{font-size:11px;color:var(--torii);font-weight:900;margin-bottom:3px;letter-spacing:1px}
.spk{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--sea);font-family:var(--kr);font-weight:900;flex:0 0 auto}
.spk:active{background:var(--soft)}
.wordlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.word{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px}
.word .jp{font-size:20px}
.pattern{background:linear-gradient(135deg,var(--mossSoft),#fff)}
.dialogue{display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:9px;align-items:flex-start}
.who{flex:0 0 auto;min-width:44px;text-align:center;border-radius:999px;background:var(--sea);color:#fff;font-size:12px;font-weight:900;padding:4px 8px;margin-top:4px}
.line.other .who{background:var(--torii)}
.bubble{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:10px 12px;min-width:0;overflow:visible;height:auto}
.bubble .jp{font-size:19px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--toriiSoft);border:1px solid #F0D2C8;border-radius:16px;padding:14px 15px;color:#7A3322;font-size:13.5px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;overflow:visible;height:auto}
.tip .i{flex:0 0 auto}
/* ---- 5초 테스트 ---- */
.quiz{display:flex;flex-direction:column;gap:10px}
.q{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:13px;overflow:visible}
.qko{font-weight:900;font-size:15.5px;word-break:keep-all}
.qbar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 0}
.qbar>span{display:block;height:100%;width:0;background:var(--torii)}
.q.run .qbar>span{width:100%;transition:width 5s linear}
.qbtns{display:flex;gap:8px;margin-top:10px}
.qbtns button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--sea);font-family:var(--kr);font-weight:900;font-size:13px;cursor:pointer}
.qbtns .go{background:var(--sea);color:#fff;border-color:var(--sea)}
.qans{display:none;border-top:1px dashed var(--line);margin-top:11px;padding-top:11px}
.q.show .qans{display:block}
.q.show .qbtns,.q.show .qbar{display:none}
.ox{display:flex;gap:8px;margin-top:10px}
.ox button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:#fff;font-family:var(--kr);font-weight:900;font-size:13px;cursor:pointer;color:var(--ink)}
.ox button.o.sel{background:var(--mossSoft);border-color:var(--moss);color:var(--moss)}
.ox button.x.sel{background:var(--toriiSoft);border-color:var(--torii);color:var(--torii)}
/* ---- 스피킹 탭 ---- */
.speakCard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow);text-align:center}
.speakCard .tag{display:inline-block;background:var(--soft);color:var(--sea);border-radius:999px;font-size:11.5px;font-weight:900;padding:4px 11px;margin-bottom:12px}
.speakCard .qko{font-size:19px;margin-bottom:4px}
.speakCard .qans{text-align:center;border-top:0;margin-top:14px;padding-top:0}
.speakCard .jp{font-size:24px}
.scount{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:8px}
.sdone{text-align:center;padding:26px 10px}
.sdone .big{font-size:34px;font-weight:900;color:var(--sea)}
.sdone p{color:var(--muted);font-size:13.5px}
.restart{margin-top:12px;padding:12px 22px;border-radius:14px;border:0;background:var(--torii);color:#fff;font-family:var(--kr);font-weight:900;font-size:14px;cursor:pointer}
/* ---- 하단 ---- */
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(243,245,244,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50}
.footer .wrap{display:flex;gap:9px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.footer button{flex:1;padding:13px 6px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--sea);font-family:var(--kr);font-weight:900;font-size:13.5px;cursor:pointer}
.footer .doneBtn{flex:1.3;background:var(--sea);color:#fff;border-color:var(--sea)}
.footer .doneBtn.ok{background:var(--moss);border-color:var(--moss)}
.secWrap{display:none}
body.mode-lesson #view-lesson{display:block}
body.mode-top #view-top{display:block}
body.mode-speak #view-speak{display:block}
body:not(.mode-lesson) .footer,body:not(.mode-lesson) .nav,body:not(.mode-lesson) .bar{display:none}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;word-break:keep-all}
@media(max-width:520px){.brand{font-size:16px}.hero h1{font-size:20px}.jp{font-size:20px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.q.run .qbar>span{transition:none;width:100%}}
</style>
</head>

<header><div class="wrap">
<div class="top">
<div><div class="sub">히로시마 여행 일본어 · 출국 전 14일 압축</div><div class="brand">広島 D-14 실전 특훈 <span style="color:var(--torii)">v3</span></div></div>

</div>
<div class="tabs">
<button id="tab-lesson" class="on">14일 특훈</button>
<button id="tab-top">TOP 문장</button>
<button id="tab-speak">스피킹 랜덤</button>
</div>
<div class="bar"><span id="prog"></span></div>
<div class="nav" id="nav"></div>
</div></header>
<main>
<section class="secWrap" id="view-lesson"></section>
<section class="secWrap" id="view-top"></section>
<section class="secWrap" id="view-speak"></section>
</main>
<div class="footer"><div class="wrap">

<button id="next">다음 →</button>
</div></div>

function rubyText(s){let out=s;const arr=[];RKEYS.forEach(k=>{if(out.indexOf(k)===-1)return;out=out.split(k).join('\u0001'+arr.length+'\u0001');arr.push('<ruby>'+k+'<rt>'+RUBY[k]+'</rt></ruby>');});arr.forEach((v,i)=>out=out.split('\u0001'+i+'\u0001').join(v));return out;}

const DEPART=new Date(2026,6,27);const WD=['일','월','화','수','목','금','토'];
function dateFor(d){const t=new Date(2026,6,27-d);return (t.getMonth()+1)+'/'+t.getDate()+'('+WD[t.getDay()]+')';}
function todayD(){const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());const diff=Math.round((DEPART-t0)/86400000);return diff;}
/* ---- TTS ---- */
const TTS=('speechSynthesis' in window);
function speak(t){if(!TTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.85;speechSynthesis.speak(u);}
function speakAll(list){if(!TTS)return;speechSynthesis.cancel();list.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.85;speechSynthesis.speak(u);});}

const app=$('view-lesson'),nav=$('nav'),headDay=$('headDay'),prog=$('prog');
function starStr(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
function phraseCard(p,src,i){return '<div class="phrase"><div class="stars">'+starStr(p[3]||5)+'</div><div class="jp">'+rubyText(p[0])+'</div><div class="ko">'+p[1]+'</div><div class="sound"><span>'+p[2]+'</span>'+(TTS?'<button class="spk" onclick="speak('+src+'['+i+'][0])">🔊 듣기</button>':'')+'</div></div>';}
function renderNav(){nav.innerHTML=DATA.days.map((d,i)=>'<button class="chip '+(i===cur?'active':'')+' '+(S.done[d.d]?'done':'')+'" onclick="goDay('+i+')">D-'+d.d+(S.done[d.d]?' ✓':'')+'<small>'+dateFor(d.d)+'</small></button>').join('');}
function goDay(i){cur=i;S.last=i;save();render();window.scrollTo({top:0});}
function updateProg(){const n=DATA.days.filter(d=>S.done[d.d]).length;prog.style.width=(n/DATA.days.length*100)+'%';}

let QSRC=[];
function startQ(i){const el=$('q'+i);if(!el||el.classList.contains('show'))return;el.classList.add('run');el.offsetWidth;QT[i]=setTimeout(()=>revealQ(i),5000);}
function revealQ(i){const el=$('q'+i);if(!el)return;clearTimeout(QT[i]);el.classList.remove('run');el.classList.add('show');speak(QSRC[i][0]);}
/* ---- 특훈 탭 ---- */
function render(){
const d=DATA.days[cur];QSRC=d.core;
headDay.firstChild.textContent='D-'+d.d+' · '+dateFor(d.d);
updateProg();renderNav();
const doneBtn=$('doneBtn');doneBtn.textContent=S.done[d.d]?'✓ D-'+d.d+' 완료됨':'D-'+d.d+' 완료';doneBtn.classList.toggle('ok',!!S.done[d.d]);
const td=todayD();const warm=(cur===0&&td>14)?'<div class="tip" style="margin-bottom:14px"><div class="i">🔥</div><div>아직 <b>D-'+td+'</b>입니다. 본 훈련은 <b>7/13(월) D-14</b>부터 — 그전까지는 <b>TOP 문장</b> 탭으로 매일 5분씩 입을 예열해 두세요.</div></div>':'';
app.innerHTML=warm+
'<div class="hero"><div class="dday">D-'+d.d+' · '+dateFor(d.d)+'</div><h1>'+d.title+'</h1><p>'+d.route+'</p><p>🎯 '+d.goal+'</p></div>'+
'<div class="card"><div class="sec"><span class="num">1</span>오늘 반드시 말할 문장'+(TTS?'<button class="act" onclick="speakAll(DATA.days[cur].core.map(c=>c[0]))">▶ 전체 듣기</button>':'')+'</div><div class="grid">'+d.core.map((p,i)=>phraseCard(p,'DATA.days[cur].core',i)).join('')+'</div></div>'+
'<div class="card"><div class="sec"><span class="num">2</span>한자 읽기 핵심 단어</div><div class="wordlist">'+d.words.map((w,i)=>'<div class="word"><div class="jp"><ruby>'+w[0]+'<rt>'+w[1]+'</rt></ruby></div><div class="ko">'+w[2]+(TTS?' <button class="spk" onclick="speak(DATA.days[cur].words['+i+'][0])">🔊</button>':'')+'</div></div>').join('')+'</div></div>'+
'<div class="card pattern"><div class="sec"><span class="num">3</span>오늘의 돌려쓰기 패턴</div><div class="jp">'+rubyText(d.pattern[0])+'</div><div class="ko">'+d.pattern[1]+'</div><div class="sound">'+rubyText(d.pattern[2])+'</div></div>'+
'<div class="card"><div class="sec"><span class="num">4</span>실전 대화문'+(TTS?'<button class="act" onclick="speakAll(DATA.days[cur].dialogue.map(x=>x[1]))">▶ 전체 듣기</button>':'')+'</div><div class="dialogue">'+d.dialogue.map((x,i)=>'<div class="line '+(x[0]==='나'?'':'other')+'"><div class="who">'+x[0]+'</div><div class="bubble"><div class="jp">'+rubyText(x[1])+'</div><div class="ko">'+x[2]+'</div><div class="sound"><span>'+x[3]+'</span>'+(TTS?'<button class="spk" onclick="speak(DATA.days[cur].dialogue['+i+'][1])">🔊</button>':'')+'</div></div></div>').join('')+'</div></div>'+
'<div class="card"><div class="sec"><span class="num">5</span>한국어 → 5초 → 일본어</div><div class="note" style="margin:0 0 10px">한국어를 보고 소리 내서 먼저 말한 뒤, 5초 후 공개되는 일본어와 비교하세요.</div><div class="quiz">'+d.core.map((c,i)=>quizCard(i,d.core)).join('')+'</div></div>'+
'<div class="card"><div class="sec"><span class="num">6</span>현지 사용 TIP</div><div class="tip"><div class="i">💡</div><div>'+d.tip+'</div></div></div>';
}
/* ---- TOP 탭 ---- */
function renderTop(){
$('view-top').innerHTML='<div class="hero"><div class="dday">TOP 30</div><h1>여행 필수 문장</h1><p>출국 직전에는 이 문장만 빠르게 돌리면 됩니다. ★ 개수 = 사용 빈도.</p></div>'+
'<div class="card"><div class="sec"><span class="num">★</span>빈도순 TOP 30'+(TTS?'<button class="act" onclick="speakAll(DATA.top.map(c=>c[0]))">▶ 전체 듣기</button>':'')+'</div><div class="grid">'+DATA.top.map((p,i)=>phraseCard(p,'DATA.top',i)).join('')+'</div></div>';
}
/* ---- 스피킹 랜덤 탭 ---- */
let POOL=[],SP={i:0,o:0,x:0};
function buildPool(){POOL=[];DATA.days.forEach(d=>d.core.forEach(c=>POOL.push({d:d.d,t:d.title,p:c})));
for(let i=POOL.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[POOL[i],POOL[j]]=[POOL[j],POOL[i]];}
POOL=POOL.slice(0,20);SP={i:0,o:0,x:0};}
function renderSpeak(){
const v=$('view-speak');
if(SP.i>=POOL.length){const total=SP.o+SP.x;const pct=total?Math.round(SP.o/total*100):0;
if(S.best===null||pct>S.best){S.best=pct;save();}
v.innerHTML='<div class="hero"><div class="dday">RESULT</div><h1>스피킹 랜덤 20문장</h1><p>전 일차에서 무작위로 뽑은 문장으로 반응 속도를 테스트합니다.</p></div><div class="card sdone"><div class="big">'+SP.o+' / '+total+'</div><p>정답률 '+pct+'% · 최고 기록 '+S.best+'%</p><button class="restart" onclick="buildPool();renderSpeak()">🔀 다시 섞어서 시작</button></div>';return;}
const it=POOL[SP.i];QSRC=POOL.map(x=>x.p);
v.innerHTML='<div class="hero"><div class="dday">SPEAKING</div><h1>스피킹 랜덤 테스트</h1><p>한국어를 보고 바로 입으로. 5초 안에 나오면 실전 합격.</p></div>'+
'<div class="speakCard"><div class="scount">'+(SP.i+1)+' / '+POOL.length+' · 지금까지 ⭕ '+SP.o+' ❌ '+SP.x+'</div><div class="tag">D-'+it.d+' · '+it.t+'</div>'+
quizCard(SP.i,QSRC.map(p=>p),'<div class="ox"><button class="o" onclick="spMark(1)">⭕ 5초 안에 말했다</button><button class="x" onclick="spMark(0)">❌ 다시 볼 문장</button></div>')+
'</div>';
}
function spMark(ok){if(ok)SP.o++;else SP.x++;SP.i++;renderSpeak();window.scrollTo({top:0});}
/* ---- 탭/이동 ---- */
function setTab(name){document.body.className='mode-'+name;['lesson','top','speak'].forEach(t=>$('tab-'+t).classList.toggle('on',t===name));
if(TTS)speechSynthesis.cancel();
if(name==='lesson'){QSRC=DATA.days[cur].core;render();}
if(name==='top')renderTop();
if(name==='speak'){buildPool();renderSpeak();}}
$('tab-lesson').onclick=()=>setTab('lesson');
$('tab-top').onclick=()=>setTab('top');
$('tab-speak').onclick=()=>setTab('speak');
$('prev').onclick=()=>{if(cur>0)goDay(cur-1);};
$('next').onclick=()=>{if(cur<DATA.days.length-1)goDay(cur+1);};
$('doneBtn').onclick=()=>{const d=DATA.days[cur].d;S.done[d]=!S.done[d];if(!S.done[d])delete S.done[d];save();render();};
/* ---- 시작 위치: 저장된 일차 → 없으면 오늘 날짜 기준 자동 ---- */
(function(){
const td=todayD();$('realD').textContent=td>0?'출발까지 '+td+'일':(td===0?'출발일!':'여행 중');
if(S.last!==null&&S.last>=0&&S.last<DATA.days.length)cur=S.last;
else{const idx=DATA.days.findIndex(x=>x.d===td);if(idx>=0)cur=idx;}
render();
})();
</script>
</body>
</html>
