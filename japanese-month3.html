<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEDF0">
<title>일본어 생활회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 브루너 6색 — 한 단계 낮추고 살짝 어둡게 */
  --red:#C24A3C;    --red-d:#A63B2F;
  --yellow:#DFA92F; --yellow-d:#C08F1F;
  --blue:#3A6494;   --blue-d:#2B4C74;
  --green:#4A7F62;  --green-d:#38634B;
  --brown:#7C5B47;  --brown-d:#5E4234;
  --grey:#8A9095;   --grey-d:#5A6167;

  --ink:#26282B;
  --ink-2:#5C6167;
  --ink-3:#8D9298;
  --base:#EDEDF0;         /* 애플 시스템 그레이 계열 */
  --line:rgba(38,40,43,.09);

  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --round:"Zen Maru Gothic","Pretendard Variable",Pretendard,ui-rounded,system-ui,sans-serif;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --pad:18px;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--base);color:var(--ink);
  font-family:var(--ko);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ── 유리가 굴절할 배경 ── */
#bg{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.5}
#bg i{position:absolute;display:block;border-radius:50%}
#bg .b1{width:52%;aspect-ratio:1;left:-8%;top:2%;background:var(--blue)}
#bg .b2{width:44%;aspect-ratio:1;right:-6%;top:18%;background:var(--yellow)}
#bg .b3{width:48%;aspect-ratio:1;left:12%;bottom:6%;background:var(--green)}
#bg .b4{width:34%;aspect-ratio:1;right:6%;bottom:-4%;background:var(--red)}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;z-index:1}

/* ── 리퀴드 글래스 ── */
.glass,.card,.daycard,.dock,header.top,#sheet .panel,.choice,.btn,.cell,.speeds button,.toggles button{
  background:linear-gradient(155deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(22px) saturate(190%);
  backdrop-filter:blur(22px) saturate(190%);
  border:.5px solid rgba(255,255,255,.72);
  box-shadow:
    inset 0 .8px 0 rgba(255,255,255,.95),
    inset 0 -.8px 0 rgba(255,255,255,.34),
    0 10px 26px -14px rgba(28,32,38,.34),
    0 2px 6px -4px rgba(28,32,38,.2);
}
@supports not (backdrop-filter:blur(2px)){
  .glass,.card,.daycard,.dock,header.top,#sheet .panel,.choice,.btn,.cell{background:rgba(255,255,255,.9)}
}

/* ── 라벨 ── */
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);
  display:flex;align-items:center;gap:9px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.plate{
  display:inline-flex;align-items:center;font-family:var(--round);
  font-size:12px;font-weight:700;letter-spacing:.02em;
  background:var(--blue);color:#fff;padding:4px 11px;border-radius:99px;
  box-shadow:0 3px 10px -4px var(--blue);
}

/* ── 상단 ── */
header.top{
  position:sticky;top:0;z-index:30;border-radius:0 0 20px 20px;border-top:0;
  padding:12px var(--pad) 12px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
}
header.top h1{margin:0;font-size:16px;font-weight:600;flex:1;letter-spacing:-.025em}
header.top .sub{font-family:var(--round);font-size:11.5px;color:var(--ink-3);font-weight:500}
.iconbtn{
  width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;
  font-size:18px;color:var(--ink-2);background:rgba(255,255,255,.5);
  transition:transform .35s var(--spring),background .2s;
}
.iconbtn:active{transform:scale(.88);background:rgba(255,255,255,.9)}

/* ── 홈 ── */
.hero{padding:26px var(--pad) 18px}
.hero .goal{font-size:21px;line-height:1.48;font-weight:600;letter-spacing:-.03em;margin:11px 0 0}
.hero .meta{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{
  font-family:var(--round);font-size:11.5px;font-weight:600;color:var(--ink-2);
  background:rgba(255,255,255,.6);padding:5px 11px;border-radius:99px;
  border:.5px solid rgba(255,255,255,.7);
}
.rail{padding:0 var(--pad) 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:11px}
.cell{
  aspect-ratio:1;border-radius:13px;display:grid;place-items:center;
  font-family:var(--round);font-size:13px;font-weight:600;color:var(--ink-2);
  position:relative;transition:transform .4s var(--spring);
}
.cell::after{
  content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--blue);
}
.cell[data-t="application"]::after{background:var(--green)}
.cell[data-t="listeningReview"]::after{background:var(--yellow)}
.cell[data-t="speakingReview"]::after{background:var(--red)}
.cell:active{transform:scale(.86)}
.cell.done{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px var(--blue-d)}
.cell.done[data-t="application"]{background:var(--green);box-shadow:0 6px 16px -8px var(--green-d)}
.cell.done[data-t="listeningReview"]{background:var(--yellow);box-shadow:0 6px 16px -8px var(--yellow-d)}
.cell.done[data-t="speakingReview"]{background:var(--red);box-shadow:0 6px 16px -8px var(--red-d)}
.cell.done::after{background:rgba(255,255,255,.85)}
.cell.today{box-shadow:0 0 0 2.5px var(--yellow),0 8px 20px -8px var(--yellow-d)}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:13px;font-size:11.5px;color:var(--ink-3);font-weight:500}
.legend i{width:8px;height:8px;display:inline-block;margin-right:6px;vertical-align:0;border-radius:50%}

.daycard{border-radius:var(--r);overflow:hidden}
.daycard .body{padding:20px 20px 18px}
.daycard h2{margin:11px 0 6px;font-size:20.5px;letter-spacing:-.035em;line-height:1.34;font-weight:600}
.daycard p{margin:0;color:var(--ink-2);font-size:13.5px}
.daycard .go{
  width:100%;background:var(--blue);color:#fff;padding:17px 20px;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:space-between;transition:transform .35s var(--spring),filter .2s;
}
.daycard .go span:last-child{font-family:var(--round);font-size:12px;opacity:.82;font-weight:600}
.daycard .go:active{filter:brightness(.9)}

.section-list{margin:22px var(--pad) 44px}
.srow{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow .n{font-family:var(--round);font-size:11.5px;color:var(--ink-3);width:22px;flex:none;font-weight:600}
.srow .t{flex:1;font-size:14.5px}
.srow .c{font-family:var(--round);font-size:12px;color:var(--ink-3);font-weight:600}

/* ── 플레이어 ── */
.progressbar{height:3px;background:rgba(38,40,43,.07);position:sticky;top:0;z-index:29}
.progressbar i{display:block;height:100%;background:var(--blue);border-radius:0 3px 3px 0;transition:width .5s var(--ease)}
#view.stage{display:block;padding:20px var(--pad) 156px}

.jp{font-family:var(--jp);letter-spacing:.015em;font-feature-settings:'palt' 1}
.jp-lg{font-size:30px;line-height:1.58;font-weight:700;letter-spacing:.01em}
.jp-md{font-size:21.5px;line-height:1.56;font-weight:500}
.jp-sm{font-size:17.5px;line-height:1.6}
ruby rt{font-family:var(--jp);font-size:.44em;color:var(--blue);font-weight:500;letter-spacing:.01em;
  transform:translateY(1px)}
.reading{font-family:var(--jp);font-size:14.5px;color:var(--blue);margin-top:6px;letter-spacing:.015em}
.ko{font-size:15.5px;margin-top:10px;color:var(--ink);letter-spacing:-.012em}
.en{font-size:14px;color:var(--ink-3);margin-top:6px;letter-spacing:-.005em}
.hide-ko .ko,.hide-ko .konly{display:none}
.hide-en .en{display:none}
.hide-fu .reading{display:none}
.hide-fu ruby rt{visibility:hidden}

.card{border-radius:var(--r);padding:21px;margin-bottom:13px}
.note{
  margin-top:15px;padding:12px 15px;background:rgba(124,91,71,.09);border-radius:14px;
  font-size:13px;color:var(--brown-d);line-height:1.58;
}
.note b{font-weight:700}

.turn{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);border-radius:12px;transition:background .3s}
.turn:last-child{border-bottom:0}
.turn .who{font-size:11px;font-weight:700;color:var(--ink-3);width:42px;flex:none;padding-top:6px}
.turn.me .who{color:var(--blue)}
.turn .txt{flex:1}
.turn.playing{background:rgba(223,169,47,.16);margin:0 -11px;padding-left:11px;padding-right:11px}

.speeds{display:flex;gap:7px;margin-top:16px}
.speeds button{
  flex:1;border-radius:99px;padding:10px 0;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:transform .35s var(--spring),background .2s,color .2s;
}
.speeds button:active{transform:scale(.93)}
.speeds button.on{background:var(--blue);color:#fff;border-color:transparent}

.choices{margin-top:17px;display:grid;gap:9px}
.choice{
  text-align:left;border-radius:16px;padding:15px 17px;font-size:15px;
  display:flex;gap:12px;align-items:center;
  transition:transform .38s var(--spring),background .25s,box-shadow .25s;
}
.choice:active:not([disabled]){transform:scale(.97)}
.choice .k{
  font-family:var(--round);font-size:11.5px;font-weight:700;color:var(--ink-3);flex:none;
  width:21px;height:21px;border-radius:50%;background:rgba(38,40,43,.07);display:grid;place-items:center;
}
.choice.ok{background:var(--green);color:#fff;border-color:transparent;animation:boing .5s var(--spring)}
.choice.ok .k{background:rgba(255,255,255,.28);color:#fff}
.choice.ng{background:rgba(194,74,60,.16);border-color:rgba(194,74,60,.3)}
.choice[disabled]{cursor:default}

.subs{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.subs .item{display:flex;gap:10px;align-items:baseline;padding:6px 0}
.subs .item .b{font-family:var(--round);font-size:11px;color:var(--ink-3);flex:none;width:14px;font-weight:600}

.reveal{margin-top:17px;padding-top:17px;border-top:2px dashed rgba(58,100,148,.28);animation:pop-in .5s var(--spring) both}
.reveal .eyebrow{margin-bottom:10px}

.drill{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);border-radius:12px;transition:background .3s}
.drill:last-child{border-bottom:0}
.drill .dn{
  font-family:var(--round);font-size:11px;font-weight:700;color:var(--ink-3);width:22px;flex:none;padding-top:4px;
}
.drill .dbody{flex:1}
.drill .dcue{font-size:16.5px;font-weight:600;line-height:1.5;letter-spacing:-.018em}
.drill .dctx{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.drill .dans{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);animation:pop-in .45s var(--spring) both}
.drill.playing{background:rgba(223,169,47,.16);margin:0 -11px;padding-left:11px;padding-right:11px}
.rpttl{font-size:16px;font-weight:700;letter-spacing:-.025em;margin-bottom:14px}
.rpstage{min-height:78px;display:grid;place-items:center;border-radius:16px;
  background:rgba(58,100,148,.07);padding:18px;margin-bottom:6px}
.rpwait{font-size:13.5px;color:var(--ink-3);text-align:center}
.rpnow{font-size:15px;font-weight:600;color:var(--blue);text-align:center;line-height:1.5}
.rpturn{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);
  animation:pop-in .45s var(--spring) both}
.rpturn:last-child{border-bottom:0}
.rpturn .who{font-size:11px;font-weight:700;color:var(--ink-3);width:34px;flex:none;padding-top:5px}
.rpturn.me .who{color:var(--blue)}
.rpturn .txt{flex:1}
.rpcue{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.rpans{margin-top:2px}
.cue{font-size:19px;font-weight:600;line-height:1.5;letter-spacing:-.025em}
.cuectx{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.55}
.rolechip{display:inline-block;font-size:11px;font-weight:700;color:var(--brown-d);
  background:rgba(124,91,71,.13);padding:4px 10px;border-radius:99px;margin-bottom:11px}
.choice .play{font-size:15px;color:var(--blue);flex:none;opacity:.65}
.jlpt{display:inline-block;font-family:var(--round);font-size:10.5px;font-weight:700;letter-spacing:.02em;
  color:var(--green);background:rgba(74,127,98,.13);padding:4px 10px;border-radius:99px;margin-bottom:11px}
.half{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.half+.half{border-top:1px dashed var(--line)}
.half .hn{width:19px;height:19px;flex:none;border-radius:50%;background:rgba(38,40,43,.07);
  display:grid;place-items:center;font-family:var(--round);font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:4px}
.drill .dalt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.drill .dalt>span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-bottom:3px}
.drill.playing .dn{color:var(--yellow-d)}
.drill.waiting .dn::after{content:"●";display:block;color:var(--red);animation:blip .9s infinite}

/* ── 발화 창 ── */
#speakwin{
  position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:34px;color:#fff;
  background:linear-gradient(165deg,rgba(43,76,116,.9),rgba(30,52,80,.94));
  -webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
}
#speakwin.on{display:flex;animation:win-in .45s var(--spring)}
#speakwin .cue{
  font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--yellow);margin-bottom:22px;
  padding:6px 14px;border-radius:99px;background:rgba(223,169,47,.16);
}
#speakwin .what{font-size:19.5px;line-height:1.52;text-align:center;max-width:340px;font-weight:600;letter-spacing:-.02em}
#speakwin .sec{
  font-family:var(--round);font-size:84px;font-weight:700;line-height:1;margin-top:30px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--yellow);
}
#speakwin .sec.tick{animation:boing .34s var(--spring)}
#speakwin .track{position:absolute;left:20px;right:20px;bottom:96px;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
#speakwin .track i{display:block;height:100%;border-radius:99px;background:var(--yellow);box-shadow:0 0 16px rgba(223,169,47,.6)}
#speakwin .skip{
  position:absolute;bottom:38px;font-size:13px;font-weight:600;color:rgba(255,255,255,.62);
  padding:11px 22px;border-radius:99px;background:rgba(255,255,255,.1);
  transition:transform .35s var(--spring);
}
#speakwin .skip:active{transform:scale(.92)}

/* ── 하단 조작 ── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;
  border-radius:24px 24px 0 0;border-bottom:0;
  padding:11px var(--pad) calc(11px + env(safe-area-inset-bottom));
}
.toggles{display:flex;gap:7px;margin-bottom:9px}
.toggles button{
  flex:1;border-radius:99px;padding:9px 0;font-size:12px;font-weight:600;color:var(--ink-3);
  transition:transform .35s var(--spring),background .2s,color .2s;
}
.toggles button:active{transform:scale(.93)}
.toggles button.on{background:var(--brown);color:#fff;border-color:transparent}
.dock .row{display:flex;gap:9px}
.btn{
  border-radius:17px;padding:15px 0;font-weight:600;font-size:15.5px;text-align:center;
  transition:transform .38s var(--spring),filter .2s;letter-spacing:-.015em;
}
.btn:active:not([disabled]){transform:scale(.955)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent;flex:1;box-shadow:0 8px 20px -10px var(--blue-d)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{width:66px;color:var(--ink-2);font-weight:600;font-size:13.5px}
.btn[disabled]{opacity:.35}
.counter{
  position:absolute;top:-27px;right:var(--pad);font-family:var(--round);font-size:11px;font-weight:600;
  color:var(--ink-2);background:rgba(255,255,255,.7);padding:3px 10px;border-radius:99px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}

/* ── 설정 ── */
#sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(28,32,38,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sheet.on{display:block;animation:fade .25s}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  border-radius:26px 26px 0 0;padding:24px var(--pad) calc(26px + env(safe-area-inset-bottom));
  animation:sheet-up .5s var(--spring);
}
#sheet h3{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-.02em}
#sheet p{margin:0 0 18px;font-size:13px;color:var(--ink-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border:.5px solid rgba(255,255,255,.8);border-radius:14px;
  background:rgba(255,255,255,.68);font-family:var(--jp);font-size:16px;color:var(--ink);
}
.field input:focus{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field input.kofield{font-family:var(--ko)}
.topline{display:flex;align-items:center;gap:15px;padding:22px var(--pad) 16px}
.ring{
  width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--blue) var(--p), rgba(38,40,43,.1) 0);
}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ring span{position:relative;font-family:var(--round);font-size:16px;font-weight:700;color:var(--ink);line-height:1}
.ring span i{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-3)}
.tl-txt{flex:1;min-width:0}
.tl-hd{font-size:16px;font-weight:700;letter-spacing:-.025em}
.tl-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.dc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dc-type{font-family:var(--round);font-size:12px;font-weight:600;color:var(--ink-3)}
.daycard{margin:0 var(--pad) 24px}
.daycard .go span:last-child{font-size:20px;opacity:.7;font-weight:400}
.done-note{text-align:center;padding:52px 20px}
.done-note .big{font-family:var(--jp);font-size:34px;font-weight:700;margin-bottom:10px;color:var(--blue)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.dots i{width:13px;height:13px;border-radius:50%;display:block;animation:hop .8s var(--spring) infinite}
.dots i:nth-child(1){background:var(--red);animation-delay:0s}
.dots i:nth-child(2){background:var(--yellow);animation-delay:.1s}
.dots i:nth-child(3){background:var(--blue);animation-delay:.2s}
.dots i:nth-child(4){background:var(--green);animation-delay:.3s}

/* ── 뿅뿅 ── */

const MONTH = DATA.month || 1;
const DAY0  = (DATA.dayRange ? DATA.dayRange[0] : DATA.days[0].day) - 1;
const dnum  = d => d - DAY0;

/* ============ 저장소 (실패해도 메모리로 동작) ============ */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
             catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let profile = JSON.parse(JSON.stringify(DATA.profile.defaults));
(function(){ const saved = store.get('jp.profile', null);
  if (saved) for (const k in saved) if (profile[k]) Object.assign(profile[k], saved[k]); })();
const PKEY = MONTH === 1 ? 'jp.progress' : `jp.progress.m${MONTH}`;
let progress = store.get(PKEY, {});
let flags    = store.get('jp.flags', {fu:true, ko:true, en:false});

const RATES = DATA.rates.length===3 ? DATA.rates : [0.6,0.85,1.0];
const byDay = Object.fromEntries(DATA.days.map(d=>[d.day,d]));

/* ============ 유틸 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fillIn(s, lang){
  return String(s==null?'':s).replace(/\{(\w+)\}/g, (m,k)=>{
    const v = profile[k]; if (!v) return m;
    return v[lang] || v.ja || m;
  });
}
const fill = s => fillIn(s, 'ja');    /* 일본어 문장 */
const fk   = s => fillIn(s, 'ko');    /* 한국어 문장 */
const fe   = s => fillIn(s, 'en');    /* 영어 문장 */
const sleep = ms => new Promise(r=>setTimeout(r, ms));

const TYPE_KO = {new:'신규 학습', application:'주간 응용', listeningReview:'듣기 복습', speakingReview:'말하기 테스트'};
const TYPE_EN = {new:'NEW', application:'APPLY', listeningReview:'LISTEN', speakingReview:'SPEAK'};

/* 카탈로그: key -> [reading, tokens?] */
function cat(k){ return (k && DATA.catalog[k]) || null; }

/* 루비 + 읽는 법 */
function jpHTML(japanese, key, cls){
  const c = cat(key);
  const tokens = c && c[1];
  let inner;
  if (tokens){
    inner = tokens.map(t=>{
      const s = esc(fill(t[0]));
      return t[1] ? `<ruby>${s}<rt>${esc(fill(t[1]))}</rt></ruby>` : s;
    }).join('');
  } else {
    inner = esc(fill(japanese));
  }
  const rd = (!tokens && c) ? `<div class="reading">${esc(fill(c[0]))}</div>` : '';
  return `<div class="jp ${cls||'jp-md'}">${inner}</div>${rd}`;
}

/* ============ 음성 ============ */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const p = lang.slice(0,2);
  return voices.find(v=>v.lang && v.lang.replace('_','-')===lang)
      || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(p)) || null;
}
let ttsOn = true;
function speak(text, lang, rate){
  text = fill(String(text||'')).replace(/\s+/g,' ').trim();
  if (!text) return Promise.resolve();
  const units = text.length;
  const est = Math.max(700, (units / (5.4*(rate||1))) * 1000 + 500);
  if (!ttsOn || !('speechSynthesis' in window)) return sleep(Math.min(est, 6000));
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate||1; u.pitch = 1;
    const v = pickVoice(lang); if (v) u.voice = v;
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, est + 5000);          /* iOS onend 미발화 대비 */
    try{ speechSynthesis.speak(u); }catch(e){ fin(); }
  });
}
const ja = (t,r)=>speak(fill(t),'ja-JP',r||1);
const ko = t=>speak(fk(t),'ko-KR',1);
const en = t=>speak(fe(t),'en-US',0.95);
function warmup(){ /* iOS: 첫 사용자 제스처에서 음성 잠금 해제 */
  if (!('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}

/* ============ 발화 창 ============ */
let winAbort = null;
function speakWindow(ms, label, cueText){
  return new Promise(res=>{
    const w=$('#speakwin'), bar=$('#swbar'), sec=$('#swsec');
    $('#swwhat').textContent = label || '';
    $('#swcue').textContent  = cueText || '말할 차례';
    w.classList.add('on');
    const total = Math.max(1200, ms||4000);
    const start = performance.now();
    bar.style.transition='none'; bar.style.width='100%';
    void bar.offsetWidth;
    bar.style.transition = `width ${total}ms linear`;
    bar.style.width = '0%';
    let raf;
    const tick = ()=>{
      const left = total - (performance.now()-start);
      const n = Math.max(0, Math.ceil(left/1000));
      if (sec.textContent !== String(n)){
        sec.textContent = n;
        sec.classList.remove('tick'); void sec.offsetWidth; sec.classList.add('tick');
      }
      if (left>0) raf = requestAnimationFrame(tick);
    };
    tick();
    const end = ()=>{
      if (winAbort!==end) return;
      winAbort=null; cancelAnimationFrame(raf);
      w.classList.remove('on'); clearTimeout(timer); res();
    };
    winAbort = end;
    const timer = setTimeout(end, total);
  });
}
$('#swskip').onclick = ()=>{ if (winAbort) winAbort(); };

  const groups = [];

  $('#view').innerHTML = `
    <div class="hero" style="padding-bottom:12px">
      <div class="eyebrow">오늘의 상황</div>

/* ============ 스텝 생성 ============ */
function buildSteps(d){
  const S = [];
  const push = (section, kind, data)=> S.push({section, kind, data});

  if (d.dialogue && d.dialogue.length)
    push(d.type==='application' ? ([75,82].includes(d.day) ? '상황별 표현 복습' : '통합 대화') : '먼저 들어보기', 'dialogue', d.dialogue);

  /* ── 표현 하나를 카드 → 따라 말하기 → 바꿔 말하기 로 끝내고 다음 표현으로 ── */
  const exprs = d.expressions || [];
  if (exprs.length){
    const shadowBy = {};
    (d.shadow||[]).forEach(x=>{ (shadowBy[x.eid] = shadowBy[x.eid]||[]).push(x); });
    const swapLeft = (d.swap||[]).slice();

    exprs.forEach((e, i)=>{
      const label = `표현 ${i+1}`;
      push(label, 'expr', e);
      const sh = shadowBy[e.id] || shadowBy[i];
      if (sh) push(label, 'shadow', sh.map(x => ({...x, j:x.j||e.j, r:x.r||e.r})));
      /* 이 표현에서 파생된 바꿔 말하기만 붙인다 */
      for (let k = swapLeft.length - 1; k >= 0; k--){
        if (swapLeft[k].from === e.j){ push(label, 'swap', swapLeft[k]); swapLeft.splice(k,1); }
      }
    });
    swapLeft.forEach(x => push('바꿔 말하기', 'swap', x));
  } else {
    (d.shadow||[]).length && (()=>{ const by={};
      d.shadow.forEach(x=>{ (by[x.eid]=by[x.eid]||[]).push(x); });
      Object.keys(by).forEach(k=> push('따라 말하기','shadow',by[k])); })();
    (d.swap||[]).forEach(x => push('바꿔 말하기', 'swap', x));
  }

  (d.links||[]).forEach(x  => push('두 문장 연결', 'link', x));
  (d.respond||[]).forEach(x=> push('듣고 바로 대답', 'respond', x));
  (d.contrast||[]).forEach(x=>push('듣기 구별', 'contrast', x));
  if (d.koToJa && d.koToJa.length) push('한국어 → 일본어', 'kotoja', d.koToJa);
  (d.free||[]).forEach(x => push(
    /무엇이라고|어떻게 확인|무엇을 (묻|말)/.test(x.qko||'') || /何と言いますか|どう(確認|聞き)/.test(x.qj||'')
      ? '이럴 땐 뭐라고' : '직접 답하기', 'free', x));
  (d.quiz||[]).forEach(x   => push('복습 문제', 'quiz', x));

  (d.apply||[]).forEach(x  => push('상황 응용', 'apply', x));
  (d.listen||[]).forEach(x => push('듣기 문제', 'listen', x));
  (d.speak||[]).forEach(x  => push('말하기 테스트', 'speak', x));
  (d.roleplay||[]).forEach(x=>push('역할극', 'roleplay', x));

  (d.reviews||[]).forEach(x=> push('예약 복습', 'review', x));

  if (d.mistakes && d.mistakes.length) push('자주 틀리는 점', 'mistakes', d.mistakes);
  if (d.selfCheck && d.selfCheck.length) push('자기 점검', 'selfcheck', d.selfCheck);
  push('마무리', 'end', d);
  return S;
}

/* ============ 플레이어 ============ */
function stopAll(){
  running=false;
  if (winAbort) winAbort();
  try{ speechSynthesis.cancel(); }catch(e){}
}
function startPlayer(){
  mode='play'; idx=0;
  $('#dock').style.display=''; $('#pbar').style.display='';
  applyFlags(); drawStep();
}
function drawStep(){
  stopAll();
  const s = steps[idx];
  if (!s) return renderHome();
  const dayT = byDay[curDay] && byDay[curDay].type;
  const TCOLOR = {new:'var(--blue)', application:'var(--green)', listeningReview:'var(--yellow)', speakingReview:'var(--red)'};
  const bar = $('#pbar').firstElementChild;
  bar.style.background = TCOLOR[dayT] || 'var(--blue)';
  bar.style.width = ((idx)/steps.length*100).toFixed(1)+'%';
  const sameBefore = steps.filter((x,i)=>i<=idx && x.section===s.section).length;
  const sameTotal  = steps.filter(x=>x.section===s.section).length;
  const exprSections = [...new Set(steps.filter(x=>/^표현 \d+$/.test(x.section)).map(x=>x.section))];
  $('#counter').textContent = /^표현 \d+$/.test(s.section) && exprSections.length>1
    ? `${s.section} · ${exprSections.indexOf(s.section)+1}/${exprSections.length}`
    : `${s.section} ${sameBefore}/${sameTotal}`;
  $('#ttl').textContent = `Day ${dnum(curDay)} · ${s.section}`;
  $('#sub').textContent = `${idx+1} / ${steps.length}`;
  $('#prev').disabled = idx===0;
  $('#next').textContent = (idx===steps.length-1) ? '완료' : '다음';
  $('#view').classList.add('stage');
  $('#view').innerHTML = RENDER[s.kind](s.data);
  applyFlags();
  bindStep(s);
  if (autoStart(s)) { setTimeout(()=>run(s), 260); }
}
$('#prev').onclick = ()=>{ if (idx>0){ idx--; drawStep(); } };
$('#next').onclick = ()=>{
  if (idx>=steps.length-1){
    progress[curDay]=true; store.set(PKEY, progress); stopAll(); return renderHome();
  }
  idx++; drawStep();
};
$('#back').onclick = ()=>{ if (mode==='play') renderDay(curDay); else renderHome(); };
const PVARS = ['name','country','job','hobby'];
$('#cfg').onclick = ()=>{
  PVARS.forEach(k=>{
    const a=$('#p-'+k+'-ja'), b=$('#p-'+k+'-ko');
    if (a) a.value = (profile[k]&&profile[k].ja)||'';
    if (b) b.value = (profile[k]&&profile[k].ko)||'';
  });
  $('#sheet').classList.add('on');
};
$('#sheet').onclick = e=>{ if (e.target.id==='sheet') $('#sheet').classList.remove('on'); };
$('#p-save').onclick = ()=>{
  PVARS.forEach(k=>{
    const a=$('#p-'+k+'-ja'), b=$('#p-'+k+'-ko');
    if (!profile[k]) profile[k]={};
    if (a && a.value.trim()) profile[k].ja = a.value.trim();
    if (b && b.value.trim()){ profile[k].ko = b.value.trim(); if(!profile[k].en) profile[k].en = b.value.trim(); }
  });
  store.set('jp.profile', profile); $('#sheet').classList.remove('on');
  mode==='play' ? drawStep() : (mode==='day' ? renderDay(curDay) : renderHome());
};
$('#p-reset').onclick = ()=>{
  progress = {}; store.set(PKEY, progress);
  $('#sheet').classList.remove('on'); renderHome();
};

/* ============ 스텝 상호작용 ============ */
function bindStep(s){
  const v = $('#view');
  const play = v.querySelector('[data-act="play"]');
  if (play) play.onclick = ()=>{ warmup(); run(s); };
  v.querySelectorAll('[data-show-answer]').forEach(btn=>btn.onclick=()=>{const box=btn.closest('[data-line]')?.querySelector('[data-ans]');if(box){box.hidden=!box.hidden;btn.textContent=box.hidden?'정답 보기':'정답 가리기';}});

  v.querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.pick;
      let correct;
      if (s.kind==='contrast' || (s.kind==='listen' && s.data.opts)){
        const opt = (s.data.opts||[])[i];
        const label = (opt && opt.label) || String.fromCharCode(65+i);
        correct = s.data.ansOpt ? label===s.data.ansOpt
                : (s.data.ans && (label===s.data.ans || (opt && fill(opt.j)===fill(s.data.ans))));
      } else {
        correct = b.dataset.val === fk(s.data.ans);
      }
      v.querySelectorAll('[data-pick]').forEach(x=>{ x.disabled=true; });
      b.classList.add(correct?'ok':'ng');
      if (!correct){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
      if (!correct){
        v.querySelectorAll('[data-pick]').forEach((x,j)=>{
          const o = (s.data.opts||[])[j];
          const lab = (o && o.label) || String.fromCharCode(65+j);
          const isAns = (s.kind==='contrast' || (s.kind==='listen' && s.data.opts))
            ? (s.data.ansOpt ? lab===s.data.ansOpt : (lab===s.data.ans || (o && fill(o.j)===fill(s.data.ans))))
            : x.dataset.val===fk(s.data.ans);
          if (isAns) x.classList.add('ok');
        });
      }
      showReveal(v);
      if (s.kind==='listen' || s.kind==='contrast') ja(s.data.j||s.data.ans, 1);
    };
  });

  v.querySelectorAll('[data-check]').forEach(b=>{ b.onclick = ()=> b.classList.toggle('ok'); });

  v.querySelectorAll('[data-rate]').forEach(b=>{
    b.onclick = async ()=>{
      warmup();
      v.querySelectorAll('[data-rate]').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      await ja(s.data.j, RATES[+b.dataset.rate]);
      b.classList.remove('on');
    };
  });
}
function showReveal(scope, stage){
  const root = scope || $('#view');
  root.querySelectorAll('[data-reveal]').forEach(el=>{
    const st = el.getAttribute('data-reveal');
    if (stage == null || !st || +st <= stage) el.hidden = false;
  });
}

/* 자동 시작할 종류 */
/* 지시가 먼저 들리고 → 말할 시간이 주어지고 → 정답이 읽히는 드릴은 탭 없이 자동 시작 */
const AUTORUN = { dialogue:false, shadow:false, roleplay:false,          /* 길어서 수동 */
                  expr:true, contrast:true, listen:true,
                  swap:true, respond:true, kotoja:true, free:true, link:true,
                  quiz:true, apply:true, speak:true, review:true };
function autoStart(s){ return AUTORUN[s.kind] || (s.kind==='review' && s.data.mode==='listeningRecall'); }

/* ============ 시퀀스 실행 ============ */
async function run(s){
  if (running) { stopAll(); return; }
  running = true;
  const token = {}; run._t = token;
  const alive = ()=> running && run._t===token && steps[idx]===s;
  const v = $('#view');
  const d = s.data;

  try{
    if (s.kind==='dialogue'){
      const els = v.querySelectorAll('[data-line]');
      for (let i=0;i<d.length;i++){
        if (!alive()) return;
        els[i] && els[i].classList.add('playing');
        els[i] && els[i].scrollIntoView({block:'center', behavior:'smooth'});
        await ja(d[i].j, 1);
        await sleep(340);
        els[i] && els[i].classList.remove('playing');
      }
    }

    else if (s.kind==='roleplay' && d.free){
      await speakWindow(d.pause||20000, fk(d.free), '자유 역할극');
    }

    else if (s.kind==='roleplay'){
      const stage = v.querySelector('#rpstage');
      const rows  = v.querySelectorAll('[data-turn]');
      const turns = d.turns||[];
      let step = 0;
      const total = turns.filter(t=>t.cue).length;
      for (let i=0;i<turns.length;i++){
        if (!alive()) return;
        const t = turns[i], el = rows[i];

        if (!t.cue){
          /* 상대 대사 — 자막 없이 듣기 */
          if (stage) stage.innerHTML = `<div class="rpnow">${esc(t.role||'상대')}의 말을 듣습니다</div>`;
          await ja(t.j, 1);
          if (!alive()) return;
          if (el){ el.hidden = false; el.scrollIntoView({block:'center', behavior:'smooth'}); }
          await sleep(420);
          continue;
        }

        /* 학습자 차례 */
        step++;
        if (t.j){                       /* 상대가 먼저 말을 건 경우 */
          if (stage) stage.innerHTML = `<div class="rpnow">${esc(t.role||'상대')}의 말을 듣습니다</div>`;
          await ja(t.j, 1);
          if (!alive()) return;
        }
        if (stage) stage.innerHTML = `<div class="rpnow">${esc(fk(t.cue))}</div>`;
        await speakWindow(t.pause||6000, fk(t.cue), `내 차례 ${step}/${total}`);
        if (!alive()) return;
        if (el){ el.hidden = false; el.scrollIntoView({block:'center', behavior:'smooth'}); }
        if (t.ok && t.ok[0]) await ja(t.ok[0].j, RATES[1]);
        else if (t.j) await ja(t.j, RATES[1]);
        if (!alive()) return;
        await sleep(300);
      }
      if (stage) stage.innerHTML = `<div class="rpwait">역할극이 끝났습니다.</div>`;
    }

    else if (s.kind==='link'){
      if (d.koPair) await ko(d.koPair);
      if (!alive()) return;
      await speakWindow(d.pause||7000, fk(d.koPair||d.ko||''), '두 문장 이어서');
      if (!alive()) return;
      showReveal(v, 1);
      await ja(d.j, RATES[1]);
    }

    else if (s.kind==='expr'){
      await ja(d.j, RATES[1]);
    }

    else if (s.kind==='shadow'){
      for (let i=0;i<3;i++){
        if (!alive()) return;
        await ja(d[0].j, RATES[i]);
        if (!alive()) return;
        await speakWindow(i===2?2600:3000, fill(d[0].j), `따라 말하기 ${i+1}/3`);
      }
    }

    else if (s.kind==='swap'){
      await ja(d.from, RATES[1]);
      if (!alive()) return;
      if (d.ko) await ko(d.ko);
      if (!alive()) return;
      await speakWindow(d.pause||4000, fk(d.ko||''), '바꿔 말하기');
      if (!alive()) return;
      showReveal(v);
      await ja(d.to, RATES[1]);
    }

    else if (s.kind==='respond'){
      if (d.pj) await ja(d.pj, 1); else if (d.ko) await ko(d.ko);
      if (!alive()) return;
      await speakWindow(d.pause||4000, fk(d.ko||'')||fill(d.pj||''), '대답하세요');
      if (!alive()) return;
      showReveal(v, 1);
      if (d.ok && d.ok[0]) await ja(d.ok[0].j, RATES[1]);
      const alt = (d.ok2 && d.ok2[0]) || (d.ok && d.ok[1]);
      if (d.pause2 && alt){
        if (!alive()) return;
        await speakWindow(d.pause2, fk(d.ko2||'같은 뜻을 다른 표현으로'), '한 번 더');
        if (!alive()) return;
        showReveal(v, 2);
        await ja(alt.j, RATES[1]);
      }
    }

    else if (s.kind==='contrast'){
      for (const o of (d.opts||[])){
        if (!alive()) return;
        await ja(o.j, 1); await sleep(500);
      }
    }

    else if (s.kind==='free'){
      if (d.qj) await ja(d.qj, 1);
      if (!alive()) return;
      await speakWindow(d.pause||6000, fk(d.qko||''), '자유롭게');
      if (!alive()) return;
      showReveal(v, 1);
      if (d.frame) await ja(d.frame, RATES[1]);
    }

    else if (s.kind==='review' && d.mode==='listeningRecall'){
      await ja(d.aj, 1);
      if (!alive()) return;
      await speakWindow(d.pause||5000, '무슨 뜻인가요?', '뜻을 말하세요');
      if (!alive()) return;
      showReveal(v, 1);
      await ja(d.aj, RATES[1]);
      if (d.mine){
        if (!alive()) return;
        await speakWindow(d.pause||5000, fk(d.mineKo||'이제 내가 할 말은?'), '내가 할 말');
        if (!alive()) return;
        showReveal(v, 2);
        await ja(d.mine, RATES[1]);
      }
    }

    else if (s.kind==='quiz' || s.kind==='review'){
      const cue = fk(d.q || d.ko || '');
      if (cue) await ko(cue);
      if (!alive()) return;
      await speakWindow(d.pause||5000, cue, '말하세요');
      if (!alive()) return;
      showReveal(v);
      const first = (d.ok && d.ok[0]) || (d.j ? {j:d.j} : null);
      if (first) await ja(first.j, RATES[1]);
    }

    else if (s.kind==='apply'){
      if (d.ko) await ko(d.ko);
      if (!alive()) return;
      await speakWindow(d.pause||5000, fk(d.ko||''), '말하세요');
      if (!alive()) return;
      showReveal(v, 1);
      await ja(d.j, RATES[1]);
      if (d.swapJ){
        if (!alive()) return;
        if (d.swapKo) await ko(d.swapKo);
        if (!alive()) return;
        await speakWindow(d.pause2||5000, fk(d.swapKo||''), '바꿔서');
        if (!alive()) return;
        showReveal(v, 2);
        await ja(d.swapJ, RATES[1]);
      }
      if (flags.en && d.en){
        if (!alive()) return;
        await speakWindow(d.enPause||4000, fe(d.en), 'IN ENGLISH');
        if (!alive()) return;
        await en(d.en);
      }
    }

    else if (s.kind==='listen' && d.kind==='replyProduction'){
      await ja(d.j, d.rate||1);
      if (!alive()) return;
      await speakWindow(d.pause||5000, fk(d.q||'듣고 이어서 대답하세요.'), '대답하세요');
      if (!alive()) return;
      showReveal(v);
      if (d.reply) await ja(d.reply, RATES[1]);
    }

    else if (s.kind==='listen' && d.opts){
      for (const o of d.opts){
        if (!alive()) return;
        await ja(o.j, d.rate||1); await sleep(520);
      }
    }

    else if (s.kind==='listen'){
      await ja(d.j, d.rate||1);
    }

    else if (s.kind==='kotoja'){
      const cards=[...v.querySelectorAll('.drill')];
      for(let i=0;i<d.length;i++){
        if(!alive())return;
        const x=d[i], card=cards[i];
        if(card){card.classList.add('playing');card.scrollIntoView({block:'center',behavior:'smooth'});}
        if(x.ko)await ko(x.ko);
        if(!alive())return;
        await speakWindow(x.pause||5000,fk(x.ko||''),'일본어로 말하세요');
        if(!alive())return;
        const answer=card?.querySelector('[data-ans]');if(answer)answer.hidden=false;
        const btn=card?.querySelector('[data-show-answer]');if(btn)btn.textContent='정답 가리기';
        if(x.ok?.[0])await ja(x.ok[0].j,RATES[1]);
        if(!alive())return;
        if(x.ok2?.[0]&&x.ko2){
          await speakWindow(x.pause2||4000,fk(x.ko2),'바꿔 말하기');
          if(!alive())return;
          await ja(x.ok2[0].j,RATES[1]);
        }
        if(card)card.classList.remove('playing');
      }
    }

    else if (s.kind==='speak'){
      if (d.ko) await ko(d.ko);
      if (!alive()) return;
      await speakWindow(d.pause||4000, fk(d.ko||''), '자막 없이');
      if (!alive()) return;
      showReveal(v, 1);
      await ja(d.j, RATES[1]);
      if (d.altJ){
        if (!alive()) return;
        if (d.altKo) await ko(d.altKo);
        if (!alive()) return;
        await speakWindow(d.altPause||4000, fk(d.altKo||'다른 표현으로'), '다른 표현으로');
        if (!alive()) return;
        showReveal(v, 2);
        await ja(d.altJ, RATES[1]);
      }
      if (flags.en && d.en){
        if (!alive()) return;
        await speakWindow(d.enPause||4000, fe(d.en), 'IN ENGLISH');
        if (!alive()) return;
        showReveal(v, 3);
        await en(d.en);
      }
    }

  } finally {
    if (run._t===token) running=false;
  }
}

document.addEventListener('visibilitychange', ()=>{ if (document.hidden) stopAll(); });
renderHome();
</script>
</body>
</html>
